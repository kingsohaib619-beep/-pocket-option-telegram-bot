name: Inspect Trade API

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "binaryoptionstoolsv2==0.2.13"

      - name: Inspect PocketOptionAsync
        run: |
          python - <<'PY'
          import inspect
          from BinaryOptionsToolsV2 import PocketOptionAsync

          print("=== PocketOptionAsync ===")
          print(PocketOptionAsync)

          print("\n=== METHODS ===")
          for name in dir(PocketOptionAsync):
              if not name.startswith("_"):
                  try:
                      obj = getattr(PocketOptionAsync, name)
                      if callable(obj):
                          print(name, inspect.signature(obj))
                      else:
                          print(name, type(obj).__name__)
                  except Exception:
                      print(name)
          PY
