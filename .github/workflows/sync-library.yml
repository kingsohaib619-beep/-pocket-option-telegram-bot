name: Import Pocket Option API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone A11ksa repository
        run: |
          git clone https://github.com/A11ksa/API-Pocket-Option.git /tmp/pocket-api

      - name: Show source structure
        run: |
          echo "=== A11ksa repository ==="
          find /tmp/pocket-api -maxdepth 4 -type f | sort

      - name: Copy complete source
        run: |
          rsync -av --exclude='.git/' /tmp/pocket-api/ ./

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import complete A11ksa library"
            git push
          fi
