name: Import Pocket Option API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone A11ksa repository
        run: |
          git clone https://github.com/A11ksa/API-Pocket-Option.git /tmp/pocket-api

      - name: Inspect source repository
        run: |
          find /tmp/pocket-api -maxdepth 3 -type f | sort

      - name: Copy source files
        run: |
          rsync -av --exclude='.git/' /tmp/pocket-api/ ./

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import A11ksa Pocket Option API"
            git push
          fi
