name: Pocket Option Telegram Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check source files
        run: |
          echo "=== Repository files ==="
          ls -la
          echo
          echo "=== bot.py ==="
          test -f bot.py
          echo "bot.py found"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "python-telegram-bot>=22,<23"
          pip install --upgrade binaryoptionstoolsv2

      - name: Verify BinaryOptionsToolsV2
        run: |
          python -c "import BinaryOptionsToolsV2; print('BinaryOptionsToolsV2 OK:', BinaryOptionsToolsV2.__file__)"
          python -c "from BinaryOptionsToolsV2 import PocketOptionAsync; print('PocketOptionAsync OK')"
          
      - name: Inspect active Pocket Option assets
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
        run: |
          python - <<'PY'
          import os
          import asyncio
          from BinaryOptionsToolsV2 import PocketOptionAsync

          async def main():
              ssid = os.environ["POCKET_OPTION_SSID"]

              async with PocketOptionAsync(ssid=ssid) as client:
                  print("=== ACTIVE ASSETS ===")

                  assets = await client.active_assets()

                  for asset in assets:
                      print(asset)

          asyncio.run(main())
          PY
      - name: Check Python syntax
        run: |
          python -m py_compile bot.py
          echo "Python syntax OK"

      - name: Check environment variables
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || {
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          }

          test -n "$POCKET_OPTION_SSID" || {
            echo "ERROR: POCKET_OPTION_SSID is missing"
            exit 1
          }

          echo "Required secrets are present"

      - name: Start Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
        run: |
          echo "Telegram bot starting..."
          python bot.py
