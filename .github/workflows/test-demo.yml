name: Test Pocket Option Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Telegram dependency
        run: |
          python -m pip install --upgrade pip
          pip install "python-telegram-bot>=22,<23"

      - name: Install BinaryOptionsToolsV2
        run: |
          pip install binaryoptionstoolsv2

      - name: Verify BinaryOptionsToolsV2
        run: |
          python -c "from BinaryOptionsToolsV2.pocketoption.asynchronous import PocketOptionAsync; print('BinaryOptionsToolsV2 OK')"

      - name: Test Demo connection
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
        run: |
          python test_demo.py
